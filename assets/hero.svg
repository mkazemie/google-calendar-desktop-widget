<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" font-family="Segoe UI, Arial, sans-serif">
  <!-- desktop wallpaper -->
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a2a6c"/>
      <stop offset="0.55" stop-color="#2d1e5f"/>
      <stop offset="1" stop-color="#0f3057"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4facfe" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#9d50bb" stop-opacity="0.25"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="640" fill="url(#wall)"/>
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0; 22 -14; 0 0" dur="18s" repeatCount="indefinite"/>
    <circle cx="240" cy="180" r="190" fill="url(#glow)"/>
    <circle cx="480" cy="460" r="150" fill="url(#glow)" opacity="0.7"/>
    <circle cx="120" cy="520" r="90" fill="#4facfe" opacity="0.12"/>
  </g>

  <!-- desktop icons -->
  <g font-size="11" fill="#ffffff" text-anchor="middle">
    <rect x="62" y="56" width="20" height="8" rx="2" fill="#e0a800"/>
    <rect x="62" y="60" width="48" height="34" rx="4" fill="#f6bf26"/>
    <text x="86" y="112" opacity="0.85">Projects</text>
    <rect x="62" y="140" width="48" height="38" rx="5" fill="#4facfe"/>
    <circle cx="75" cy="152" r="4.5" fill="#ffffff" opacity="0.9"/>
    <path d="M64 176 l14 -14 10 9 7 -6 13 11 z" fill="#1a57b8"/>
    <text x="86" y="196" opacity="0.85">Photos</text>
    <rect x="68" y="222" width="36" height="46" rx="4" fill="#f1f3f4"/>
    <g stroke="#9aa0a6" stroke-width="2">
      <line x1="75" y1="234" x2="97" y2="234"/><line x1="75" y1="242" x2="97" y2="242"/><line x1="75" y1="250" x2="91" y2="250"/>
    </g>
    <text x="86" y="284" opacity="0.85">Notes</text>
  </g>

  <!-- a file on the desktop, UNDER the calendar -->
  <rect x="672" y="284" width="60" height="78" rx="4" fill="#cce8ff" fill-opacity="0.35" stroke="#99d1ff" opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.06;0.065;0.27;0.29;1" dur="18s" repeatCount="indefinite"/>
  </rect>
  <path d="M684 290 h26 l10 10 v36 h-36 z" fill="#ffffff"/>
  <path d="M710 290 v10 h10" fill="#dadce0"/>
  <rect x="684" y="316" width="36" height="12" fill="#ea4335"/>
  <text x="702" y="325.5" fill="#ffffff" font-size="8" font-weight="700" text-anchor="middle">PDF</text>
  <text x="702" y="354" fill="#ffffff" font-size="11" text-anchor="middle">Report.pdf</text>

  <!-- the widget: translucent calendar pinned to the desktop -->
  <rect x="628" y="52" width="500" height="500" rx="14" fill="#000000" opacity="0.30"/>
  <g opacity="0.76">
    <!-- title bar in widget mode: only the mouse + menu buttons, in the calendar's theme -->
    <path d="M620 78 v-26 a8 8 0 0 1 8 -8 h484 a8 8 0 0 1 8 8 v26 z" fill="#f8fafd"/>
    <circle cx="1051" cy="61" r="6" fill="none" stroke="#1a73e8" stroke-width="2">
      <animate attributeName="r" values="6;15" dur="2.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <g transform="translate(1051 61)" fill="none" stroke="#1a73e8" stroke-width="1.6">
      <rect x="-4.5" y="-7" width="9" height="14" rx="4.5"/><line x1="0" y1="-4.5" x2="0" y2="-1.5" stroke-linecap="round"/>
    </g>
    <g stroke="#3c4043" stroke-width="1.6" stroke-linecap="round">
      <line x1="1090" y1="56.5" x2="1104" y2="56.5"/><line x1="1090" y1="61" x2="1104" y2="61"/><line x1="1090" y1="65.5" x2="1104" y2="65.5"/>
    </g>

    <!-- calendar page header -->
    <rect x="620" y="78" width="500" height="466" fill="#f8fafd"/>
    <g stroke="#444746" stroke-width="1.5" stroke-linecap="round">
      <line x1="634" y1="92" x2="646" y2="92"/><line x1="634" y1="97" x2="646" y2="97"/><line x1="634" y1="102" x2="646" y2="102"/>
    </g>
    <rect x="656" y="89" width="16" height="16" rx="4" fill="#1a73e8"/>
    <rect x="659" y="93" width="10" height="8.5" fill="#ffffff"/>
    <rect x="659" y="93" width="10" height="2.6" fill="#174ea6"/>
    <text x="680" y="103" fill="#1f1f1f" font-size="14">Calendar</text>
    <rect x="752" y="86" width="48" height="22" rx="11" fill="none" stroke="#747775"/>
    <text x="776" y="101" fill="#1f1f1f" font-size="10.5" text-anchor="middle">Today</text>
    <text x="812" y="103" fill="#444746" font-size="15">‹</text>
    <text x="828" y="103" fill="#444746" font-size="15">›</text>
    <text x="848" y="103" fill="#1f1f1f" font-size="14">November 2026</text>

    <!-- week grid -->
    <rect x="624" y="118" width="492" height="426" rx="12" fill="#ffffff"/>
    <g fill="#444746" font-size="10" text-anchor="middle">
      <text x="702" y="136">MON</text><text x="795" y="136">TUE</text><text x="888" y="136" fill="#1a73e8">WED</text>
      <text x="980" y="136">THU</text><text x="1073" y="136">FRI</text>
    </g>
    <circle cx="888" cy="156" r="14" fill="#1a73e8"/>
    <g fill="#1f1f1f" font-size="18" text-anchor="middle">
      <text x="702" y="162">16</text><text x="795" y="162">17</text><text x="888" y="162" fill="#ffffff">18</text>
      <text x="980" y="162">19</text><text x="1073" y="162">20</text>
    </g>
    <g stroke="#dadce0" stroke-width="1">
      <line x1="624" y1="176" x2="1116" y2="176"/><line x1="656" y1="232" x2="1116" y2="232"/>
      <line x1="656" y1="288" x2="1116" y2="288"/><line x1="656" y1="344" x2="1116" y2="344"/>
      <line x1="656" y1="400" x2="1116" y2="400"/><line x1="656" y1="456" x2="1116" y2="456"/>
      <line x1="656" y1="512" x2="1116" y2="512"/>
      <line x1="656" y1="176" x2="656" y2="544"/><line x1="749" y1="176" x2="749" y2="544"/>
      <line x1="842" y1="176" x2="842" y2="544"/><line x1="934" y1="176" x2="934" y2="544"/>
      <line x1="1027" y1="176" x2="1027" y2="544"/>
    </g>
    <g fill="#70757a" font-size="8" text-anchor="end">
      <text x="652" y="235">10 AM</text><text x="652" y="291">11 AM</text><text x="652" y="347">12 PM</text>
      <text x="652" y="403">1 PM</text><text x="652" y="459">2 PM</text><text x="652" y="515">3 PM</text>
    </g>

    <!-- events -->
    <g fill="#ffffff" font-size="10.5">
      <rect x="660" y="178" width="85" height="42" rx="6" fill="#1a73e8"/>
      <text x="666" y="193" font-weight="600">Team sync</text><text x="666" y="207" font-size="9" opacity="0.85">9:00 – 9:45</text>
      <rect x="753" y="234" width="85" height="110" rx="6" fill="#0b8043"/>
      <text x="759" y="249" font-weight="600">Deep work</text><text x="759" y="263" font-size="9" opacity="0.85">10:00 – 12:00</text>
      <rect x="846" y="374" width="84" height="40" rx="6" fill="#f4511e"/>
      <text x="852" y="389" font-weight="600">Lunch w/ Sara</text><text x="852" y="403" font-size="9" opacity="0.85">12:30 – 13:15</text>
      <rect x="938" y="206" width="85" height="82" rx="6" fill="#8e24aa"/>
      <text x="944" y="221" font-weight="600">Design review</text><text x="944" y="235" font-size="9" opacity="0.85">9:30 – 11:00</text>
      <rect x="938" y="402" width="85" height="52" rx="6" fill="#f6bf26"/>
      <text x="944" y="417" font-weight="600" fill="#3c4043">Gym</text><text x="944" y="431" font-size="9" fill="#3c4043" opacity="0.85">13:00 – 14:00</text>
      <rect x="1031" y="234" width="85" height="40" rx="6" fill="#7986cb"/>
      <text x="1037" y="249" font-weight="600">1:1 with Alex</text><text x="1037" y="263" font-size="9" opacity="0.85">10:00 – 10:45</text>
    </g>

    <!-- the event added on the phone pops in -->
    <g transform="translate(1073.5 484)">
      <g>
        <animateTransform attributeName="transform" type="scale" values="0;0;1.15;1;1;0;0" keyTimes="0;0.78;0.80;0.82;0.95;0.97;1" dur="18s" repeatCount="indefinite"/>
        <rect x="-42.5" y="-26" width="85" height="52" rx="6" fill="#039be5"/>
        <text x="-36.5" y="-11" fill="#ffffff" font-size="10.5" font-weight="600">Dentist</text>
        <text x="-36.5" y="3" fill="#ffffff" font-size="9" opacity="0.85">14:00 – 15:00</text>
      </g>
    </g>

    <!-- "now" line -->
    <line x1="842" y1="356" x2="934" y2="356" stroke="#ea4335" stroke-width="2.5"/>
    <circle cx="842" cy="356" r="5" fill="#ea4335">
      <animate attributeName="r" values="5;6.5;5" dur="2s" repeatCount="indefinite"/>
    </circle>
  </g>
  <rect x="1031" y="458" width="85" height="52" rx="7" fill="none" stroke="#039be5" opacity="0">
    <animate attributeName="stroke-width" values="2;2;14;14" keyTimes="0;0.80;0.88;1" dur="18s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0;0.7;0;0" keyTimes="0;0.80;0.805;0.88;1" dur="18s" repeatCount="indefinite"/>
  </rect>

  <!-- beat 1: the file opens in its own window, on top as usual -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.11;0.125;0.26;0.28;1" dur="18s" repeatCount="indefinite"/>
    <g transform="translate(355 270)">
      <g>
        <animateTransform attributeName="transform" type="scale" values="0.9;0.9;1;1" keyTimes="0;0.11;0.13;1" dur="18s" repeatCount="indefinite"/>
        <g transform="translate(-355 -270)">
          <rect x="156" y="118" width="410" height="320" rx="9" fill="#000000" opacity="0.35"/>
          <rect x="150" y="110" width="410" height="320" rx="8" fill="#e9e9ec"/>
          <path d="M150 142 v-24 a8 8 0 0 1 8 -8 h394 a8 8 0 0 1 8 8 v24 z" fill="#f3f3f3"/>
          <rect x="163" y="119" width="12" height="14" rx="2" fill="#ea4335"/>
          <text x="183" y="131" fill="#1f1f1f" font-size="12">Report.pdf</text>
          <g stroke="#5f6368" stroke-width="1.2" fill="none">
            <line x1="474" y1="126" x2="484" y2="126"/>
            <rect x="503" y="121" width="9" height="9"/>
            <line x1="533" y1="121" x2="542" y2="130"/><line x1="542" y1="121" x2="533" y2="130"/>
          </g>
          <rect x="196" y="154" width="318" height="276" fill="#ffffff"/>
          <rect x="222" y="176" width="150" height="10" rx="2" fill="#3c4043"/>
          <g fill="#dadce0">
            <rect x="222" y="198" width="268" height="6" rx="2"/><rect x="222" y="212" width="250" height="6" rx="2"/>
            <rect x="222" y="226" width="262" height="6" rx="2"/><rect x="222" y="240" width="180" height="6" rx="2"/>
          </g>
          <g fill="#1a73e8">
            <rect x="236" y="352" width="22" height="48"/><rect x="268" y="330" width="22" height="70"/>
            <rect x="300" y="338" width="22" height="62"/><rect x="332" y="312" width="22" height="88"/>
            <rect x="364" y="298" width="22" height="102"/><rect x="396" y="320" width="22" height="80"/>
            <rect x="428" y="284" width="22" height="116"/>
          </g>
          <line x1="226" y1="400" x2="462" y2="400" stroke="#9aa0a6"/>
        </g>
      </g>
    </g>
  </g>

  <!-- beat 2: Windows desktop context menu, opened by right-clicking THROUGH the widget -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.365;0.38;0.57;0.59;1" dur="18s" repeatCount="indefinite"/>
    <rect x="890" y="311" width="210" height="180" rx="9" fill="#000000" opacity="0.35"/>
    <rect x="886" y="306" width="210" height="180" rx="9" fill="#2b2d33" stroke="#3d4046" stroke-width="1"/>
    <rect x="892" y="362" width="198" height="24" rx="6" fill="#ffffff" opacity="0">
      <animate attributeName="y" values="362;362;430;430" keyTimes="0;0.49;0.50;1" dur="18s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0;0.1;0.1;0;0" keyTimes="0;0.455;0.46;0.57;0.58;1" dur="18s" repeatCount="indefinite"/>
    </rect>
    <g fill="#e8eaed" font-size="12.5">
      <text x="904" y="330">View</text>
      <text x="904" y="354">Sort by</text>
      <text x="904" y="378">Refresh</text>
      <text x="904" y="412">New</text>
      <text x="904" y="446">Display settings</text>
      <text x="904" y="470">Personalize</text>
    </g>
    <g fill="#9aa0a6" font-size="12" text-anchor="end">
      <text x="1080" y="330">›</text>
      <text x="1080" y="354">›</text>
      <text x="1080" y="412">›</text>
    </g>
    <line x1="894" y1="390" x2="1088" y2="390" stroke="#3d4046" stroke-width="1"/>
    <line x1="894" y1="424" x2="1088" y2="424" stroke="#3d4046" stroke-width="1"/>
  </g>

  <!-- clicks: double-click on the file, right-click on the wallpaper -->
  <g fill="none" stroke="#1a73e8" stroke-width="2.5">
    <circle cx="702" cy="312" r="3" opacity="0">
      <animate attributeName="r" values="3;3;24;24" keyTimes="0;0.07;0.10;1" dur="18s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0;0.85;0;0" keyTimes="0;0.07;0.075;0.10;1" dur="18s" repeatCount="indefinite"/>
    </circle>
    <circle cx="702" cy="312" r="3" opacity="0">
      <animate attributeName="r" values="3;3;24;24" keyTimes="0;0.09;0.12;1" dur="18s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0;0.85;0;0" keyTimes="0;0.09;0.095;0.12;1" dur="18s" repeatCount="indefinite"/>
    </circle>
    <circle cx="880" cy="300" r="3" opacity="0">
      <animate attributeName="r" values="3;3;26;26" keyTimes="0;0.36;0.40;1" dur="18s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0;0.85;0;0" keyTimes="0;0.36;0.365;0.40;1" dur="18s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- moving cursor -->
  <g>
    <animateTransform attributeName="transform" type="translate"
      values="900 300; 702 312; 702 312; 880 300; 880 300; 950 374; 950 442; 950 442; 1070 566; 1070 566; 900 300"
      keyTimes="0;0.06;0.12;0.30;0.42;0.46;0.52;0.58;0.64;0.94;1" dur="18s" repeatCount="indefinite"/>
    <path d="M0 0 L0 22 L6 16 L10 26 L14.5 24 L10.5 14 L18 14 Z" fill="#ffffff" stroke="#3c4043" stroke-width="1.4"/>
  </g>

  <!-- taskbar -->
  <rect x="0" y="616" width="1200" height="24" fill="#101418" opacity="0.92"/>
  <g fill="#ffffff" opacity="0.5">
    <rect x="562" y="622" width="12" height="12" rx="3"/>
    <rect x="586" y="622" width="12" height="12" rx="3"/>
    <rect x="610" y="622" width="12" height="12" rx="3"/>
    <rect x="634" y="622" width="12" height="12" rx="3"/>
  </g>
  <text x="1160" y="631" fill="#ffffff" opacity="0.6" font-size="10" text-anchor="middle">12:34</text>

  <!-- beat 3: an event saved on a phone syncs to the desktop -->
  <path d="M404 336 C 560 200, 900 180, 1072 470" fill="none" stroke="#8ab4f8" stroke-width="2" stroke-dasharray="4 7" opacity="0">
    <animate attributeName="opacity" values="0;0;0.55;0.55;0;0" keyTimes="0;0.71;0.725;0.78;0.82;1" dur="18s" repeatCount="indefinite"/>
  </path>
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.715;0.72;0.78;0.785;1" dur="18s" repeatCount="indefinite"/>
    <animateMotion path="M404 336 C 560 200, 900 180, 1072 470" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.72;0.78;1" dur="18s" repeatCount="indefinite"/>
    <circle r="11" fill="#8ab4f8" opacity="0.3"/>
    <circle r="5" fill="#8ab4f8"/>
  </g>
  <g transform="translate(0 360)">
    <animateTransform attributeName="transform" type="translate" values="0 360;0 360;0 0;0 0;0 360;0 360" keyTimes="0;0.62;0.66;0.86;0.90;1" dur="18s" repeatCount="indefinite"/>
    <rect x="250" y="300" width="160" height="300" rx="24" fill="#0e0f12" stroke="#5f6368" stroke-width="2"/>
    <rect x="258" y="312" width="144" height="276" rx="17" fill="#1f2024"/>
    <rect x="312" y="318" width="36" height="6" rx="3" fill="#0e0f12"/>
    <text x="272" y="350" fill="#e8eaed" font-size="13" font-weight="600">New event</text>
    <g stroke="#9aa0a6" stroke-width="1.6" stroke-linecap="round">
      <line x1="382" y1="341" x2="390" y2="349"/><line x1="390" y1="341" x2="382" y2="349"/>
    </g>
    <text x="272" y="384" fill="#ffffff" font-size="17">Dentist</text>
    <line x1="272" y1="394" x2="390" y2="394" stroke="#8ab4f8" stroke-width="2"/>
    <circle cx="278" cy="416" r="5.5" fill="none" stroke="#9aa0a6" stroke-width="1.4"/>
    <path d="M278 413 v3.5 l2.5 1.5" stroke="#9aa0a6" stroke-width="1.2" fill="none"/>
    <text x="292" y="420" fill="#c4c7c5" font-size="11">Fri, Nov 20</text>
    <text x="292" y="436" fill="#c4c7c5" font-size="11">14:00 – 15:00</text>
    <circle cx="278" cy="458" r="5" fill="#039be5"/>
    <text x="292" y="462" fill="#c4c7c5" font-size="11">Work calendar</text>
    <rect x="318" y="544" width="72" height="28" rx="14" fill="#8ab4f8"/>
    <text x="354" y="562" fill="#0b1d3a" font-size="12" font-weight="600" text-anchor="middle">Save
      <animate attributeName="opacity" values="1;1;0;0;1;1" keyTimes="0;0.71;0.715;0.90;0.905;1" dur="18s" repeatCount="indefinite"/>
    </text>
    <text x="354" y="562" fill="#0b1d3a" font-size="12" font-weight="600" text-anchor="middle" opacity="0">✓ Saved
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.71;0.715;0.90;0.905;1" dur="18s" repeatCount="indefinite"/>
    </text>
    <circle cx="354" cy="558" r="3" fill="none" stroke="#ffffff" stroke-width="2.5" opacity="0">
      <animate attributeName="r" values="3;3;20;20" keyTimes="0;0.70;0.73;1" dur="18s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0;0.9;0;0" keyTimes="0;0.70;0.705;0.73;1" dur="18s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- captions, one per beat -->
  <g>
    <animate attributeName="opacity" values="1;1;0;0;1;1" keyTimes="0;0.29;0.32;0.95;0.98;1" dur="18s" repeatCount="indefinite"/>
    <rect x="560" y="578" width="360" height="34" rx="17" fill="#202124" opacity="0.92"/>
    <text x="740" y="600" fill="#e8eaed" font-size="14" text-anchor="middle">Double-click a file right through your calendar</text>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.32;0.35;0.58;0.61;1" dur="18s" repeatCount="indefinite"/>
    <rect x="510" y="578" width="460" height="34" rx="17" fill="#202124" opacity="0.92"/>
    <text x="740" y="600" fill="#e8eaed" font-size="14" text-anchor="middle">Even right-click opens the desktop menu, through the calendar</text>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.61;0.64;0.93;0.96;1" dur="18s" repeatCount="indefinite"/>
    <rect x="500" y="578" width="480" height="34" rx="17" fill="#202124" opacity="0.92"/>
    <text x="740" y="600" fill="#e8eaed" font-size="14" text-anchor="middle">Add an event on your phone: it's on your desktop seconds later</text>
  </g>
</svg>
