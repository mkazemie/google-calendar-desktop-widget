#
# Before a pull request can be merged, everyone who committed to it must agree to
# the contribution terms in CONTRIBUTING.md (dual licensing needs them). The bot
# asks new contributors to post a one-line comment and records each agreement in
# signatures/v1/cla.json on the separate "cla-signatures" branch, which keeps
# main's history free of bot commits. If the terms ever change, point
# path-to-signatures at a new folder (v2, ...) so everyone agrees again.
#
# pull_request_target runs with write access even for pull requests from forks,
# so this workflow must never check out or run the pull request's code. For the
# same reason the action is pinned to a full commit SHA, not a movable tag.

name: Contribution terms

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, synchronize, reopened, closed]

permissions:
  actions: write        # re-run the check after someone agrees
  contents: write       # record agreements on the cla-signatures branch
  pull-requests: write  # comment on the pull request
  statuses: write       # pass/fail status on the pull request

jobs:
  agreement:
    # comments only count on pull requests, and only the two the bot understands
    if: >-
      github.event_name == 'pull_request_target' ||
      (github.event.issue.pull_request &&
       (github.event.comment.body == 'recheck' ||
        github.event.comment.body == 'I have read CONTRIBUTING.md and agree to its contribution terms'))
    runs-on: ubuntu-latest
    steps:
      - uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08  # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-document: "https://github.com/mkazemie/google-calendar-desktop-widget/blob/main/CONTRIBUTING.md#license-of-contributions"
          path-to-signatures: "signatures/v1/cla.json"
          branch: "cla-signatures"
          allowlist: "mkazemie,*[bot]"
          custom-pr-sign-comment: "I have read CONTRIBUTING.md and agree to its contribution terms"
          custom-notsigned-prcomment: >-
            Thanks for your contribution! Before it can be merged, please read the
            [contribution terms](https://github.com/mkazemie/google-calendar-desktop-widget/blob/main/CONTRIBUTING.md#license-of-contributions)
            and agree to them by posting the comment below. You only need to do this once.
          custom-allsigned-prcomment: "Everyone has agreed to the contribution terms. Thank you!"
