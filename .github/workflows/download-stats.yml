#
# Once a day, record every release asset's download count and the repository's
# traffic. GitHub only reports a running download total and keeps traffic for 14
# days, so these daily snapshots are what turn them into history. Files go to the
# separate "stats" branch, which keeps main's history free of daily commits:
#   downloads.csv  cumulative downloads per release asset, one row per asset per day
#   views.csv      repo page views and unique visitors per day
#   clones.csv     git clones and unique cloners per day
#   referrers.csv  top referring sites, 14-day totals, one snapshot per day
#   paths.csv      most viewed repo pages, 14-day totals, one snapshot per day
# Traffic needs the TRAFFIC_TOKEN secret: a fine-grained token for this repository
# with "Administration: Read-only" (the built-in token can't read traffic).

name: Download and traffic stats

on:
  schedule:
    - cron: "23 4 * * *"  # daily 04:23 UTC; off the hour, since top-of-hour runs get delayed
  workflow_dispatch:

permissions:
  contents: write

concurrency: download-stats

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Switch to the stats branch
        run: |
          if git fetch --depth=1 origin stats; then
            git switch -c stats FETCH_HEAD
          else
            git switch --orphan stats  # first run: start the branch empty
          fi

      - name: Record today's download counts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          today=$(date -u +%F)
          file=downloads.csv
          [ -f "$file" ] || echo "date,tag,asset,downloads" > "$file"
          # a second run on the same day replaces that day's rows instead of adding more
          grep -v "^$today," "$file" > "$file.tmp" || true
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases" \
            --jq '.[] | .tag_name as $tag | .assets[] | "\($tag),\(.name),\(.download_count)"' \
            | sed "s/^/$today,/" >> "$file.tmp"
          mv "$file.tmp" "$file"

      - name: Record repository traffic
        shell: bash  # -eo pipefail: a failed API call stops here instead of landing in a CSV
        env:
          GH_TOKEN: ${{ secrets.TRAFFIC_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::TRAFFIC_TOKEN secret is not set; skipping traffic"
            exit 0
          fi
          today=$(date -u +%F)
          # fetched before any file is touched; on an error gh prints the error body,
          # which must never be stored as data
          api() { gh api "repos/$GITHUB_REPOSITORY/traffic/$1" --jq "$2"; }

          # views and clones come per day for the last 14 days; days reported again
          # (including today's partial count) replace the rows already stored
          daily() {  # file, header, endpoint
            local rows
            rows=$(api "$3" ".$3[] | \"\(.timestamp[0:10]),\(.count),\(.uniques)\"")
            [ -f "$1" ] || echo "$2" > "$1"
            { tail -n +2 "$1"; echo "$rows"; } \
              | awk -F, 'NF { row[$1] = $0 } END { for (d in row) print row[d] }' | sort > "$1.rows"
            { head -1 "$1"; cat "$1.rows"; } > "$1.tmp"
            mv "$1.tmp" "$1"
            rm "$1.rows"
          }
          daily views.csv "date,views,unique_visitors" views
          daily clones.csv "date,clones,unique_cloners" clones

          # referrers and pages only exist as 14-day totals: keep one snapshot per day
          snapshot() {  # file, header, endpoint, jq row
            local rows
            rows=$(api "$3" ".[] | $4 | @csv")
            [ -f "$1" ] || echo "$2" > "$1"
            grep -v "^$today," "$1" > "$1.tmp" || true
            if [ -n "$rows" ]; then
              echo "$rows" | sed "s/^/$today,/" >> "$1.tmp"
            fi
            mv "$1.tmp" "$1"
          }
          snapshot referrers.csv "date,referrer,views_14d,unique_visitors_14d" popular/referrers "[.referrer, .count, .uniques]"
          snapshot paths.csv "date,path,views_14d,unique_visitors_14d" popular/paths "[.path, .count, .uniques]"

      - name: Commit
        if: always()  # keep the download counts even if the traffic step failed (e.g. expired token)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- *.csv
          if git diff --cached --quiet; then
            echo "No change since the last snapshot"
            exit 0
          fi
          git commit -m "Stats for $(date -u +%F)"
          git push origin stats
