#
# Once a day, record every release asset's download count. GitHub only reports a
# running total, so these daily snapshots are what turn it into downloads per day
# and per version. Rows go to downloads.csv on the separate "stats" branch, which
# keeps main's history free of daily commits.

name: Download stats

on:
  schedule:
    - cron: "23 4 * * *"  # daily 04:23 UTC; off the hour, since top-of-hour runs get delayed
  workflow_dispatch:

permissions:
  contents: write

concurrency: download-stats

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Switch to the stats branch
        run: |
          if git fetch --depth=1 origin stats; then
            git switch -c stats FETCH_HEAD
          else
            git switch --orphan stats  # first run: start the branch empty
          fi

      - name: Record today's counts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          today=$(date -u +%F)
          file=downloads.csv
          [ -f "$file" ] || echo "date,tag,asset,downloads" > "$file"
          # a second run on the same day replaces that day's rows instead of adding more
          grep -v "^$today," "$file" > "$file.tmp" || true
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases" \
            --jq '.[] | .tag_name as $tag | .assets[] | "\($tag),\(.name),\(.download_count)"' \
            | sed "s/^/$today,/" >> "$file.tmp"
          mv "$file.tmp" "$file"

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add downloads.csv
          if git diff --cached --quiet; then
            echo "No change since the last snapshot"
            exit 0
          fi
          git commit -m "Download counts for $(date -u +%F)"
          git push origin stats
