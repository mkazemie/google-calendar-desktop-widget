name: Report a problem
description: Something in the widget doesn't work as expected.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for reporting! A few details help a lot. Please don't include personal calendar contents or account details.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version
      description: Shown in Settings (or the installer file name, e.g. 1.3.2).
    validations:
      required: true
  - type: dropdown
    id: windows
    attributes:
      label: Windows version
      options: [Windows 11, Windows 10, Other]
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Which mode were you in?
      options: [Widget mode (click-through), Live-wallpaper mode (behind desktop icons), Interactive mode, Installing / first run, Not sure]
    validations:
      required: true
  - type: input
    id: displays
    attributes:
      label: Monitors and display scale
      description: e.g. "laptop 150% + external 100%".
  - type: textarea
    id: extra
    attributes:
      label: Anything else?
      description: Screenshots or steps to reproduce are very welcome.
