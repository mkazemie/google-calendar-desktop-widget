<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <linearGradient id="pbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a2a6c"/><stop offset="0.6" stop-color="#2d1e5f"/><stop offset="1" stop-color="#0f3057"/>
    </linearGradient>
    <!-- edge shadows: black fading to clear along a cosine curve, like the app's -->
    <linearGradient id="shadeL" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#000" stop-opacity="1"/>
      <stop offset="0.2" stop-color="#000" stop-opacity="0.905"/>
      <stop offset="0.4" stop-color="#000" stop-opacity="0.655"/>
      <stop offset="0.6" stop-color="#000" stop-opacity="0.345"/>
      <stop offset="0.8" stop-color="#000" stop-opacity="0.095"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="shadeR" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#000" stop-opacity="1"/>
      <stop offset="0.2" stop-color="#000" stop-opacity="0.905"/>
      <stop offset="0.4" stop-color="#000" stop-opacity="0.655"/>
      <stop offset="0.6" stop-color="#000" stop-opacity="0.345"/>
      <stop offset="0.8" stop-color="#000" stop-opacity="0.095"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="fadeL" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8ab4f8"/><stop offset="1" stop-color="#8ab4f8" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="fadeR" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#8ab4f8"/><stop offset="1" stop-color="#8ab4f8" stop-opacity="0"/>
    </linearGradient>
    <filter id="lift" x="-30%" y="-10%" width="160%" height="120%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.2" flood-color="#000" flood-opacity="0.85"/>
    </filter>
    <g id="icons" font-size="11" fill="#ffffff" text-anchor="middle">
      <rect x="70" y="96" width="20" height="8" rx="2" fill="#e0a800"/>
      <rect x="70" y="100" width="48" height="34" rx="4" fill="#f6bf26"/>
      <text x="94" y="152">Work</text>
      <rect x="70" y="184" width="48" height="38" rx="5" fill="#4facfe"/>
      <circle cx="83" cy="196" r="4.5" fill="#ffffff" opacity="0.9"/>
      <path d="M72 220 l14 -14 10 9 7 -6 13 11 z" fill="#1a57b8"/>
      <text x="94" y="240">Media</text>
      <rect x="76" y="266" width="36" height="46" rx="4" fill="#f1f3f4"/>
      <g stroke="#9aa0a6" stroke-width="2">
        <line x1="83" y1="278" x2="105" y2="278"/><line x1="83" y1="286" x2="105" y2="286"/><line x1="83" y1="294" x2="99" y2="294"/>
      </g>
      <text x="94" y="328">Notes</text>
    </g>
  </defs>

  <rect width="1200" height="560" rx="16" fill="url(#pbg)"/>
  <circle cx="220" cy="150" r="150" fill="#4facfe" opacity="0.12"/>
  <circle cx="1000" cy="430" r="130" fill="#9d50bb" opacity="0.12"/>

  <use href="#icons"/>

  <!-- calendar in widget mode: its opacity follows the transparency slider -->
  <g opacity="0.88">
    <animate attributeName="opacity" values="0.88;0.88;0.38;0.38;0.88;0.88" keyTimes="0;0.04;0.14;0.22;0.30;1" dur="15s" repeatCount="indefinite"/>
    <!-- title bar in widget mode: only its two buttons, in the calendar's light theme -->
    <path d="M40 58 v-22 a8 8 0 0 1 8 -8 h1104 a8 8 0 0 1 8 8 v22 z" fill="#f8fafd"/>
    <g transform="translate(1091 43)" fill="none" stroke="#1a73e8" stroke-width="1.5">
      <rect x="-4.5" y="-7" width="9" height="14" rx="4.5"/><line x1="0" y1="-4.5" x2="0" y2="-1.5" stroke-linecap="round"/>
    </g>
    <g stroke="#3c4043" stroke-width="1.5" stroke-linecap="round">
      <line x1="1130" y1="38.5" x2="1144" y2="38.5"/><line x1="1130" y1="43" x2="1144" y2="43"/><line x1="1130" y1="47.5" x2="1144" y2="47.5"/>
    </g>
    <rect x="40" y="58" width="1120" height="454" fill="#ffffff"/>
    <g stroke="#dadce0" stroke-width="1">
      <line x1="40" y1="134" x2="1160" y2="134"/><line x1="40" y1="210" x2="1160" y2="210"/>
      <line x1="40" y1="286" x2="1160" y2="286"/><line x1="40" y1="362" x2="1160" y2="362"/>
      <line x1="40" y1="438" x2="1160" y2="438"/>
      <line x1="264" y1="58" x2="264" y2="512"/><line x1="488" y1="58" x2="488" y2="512"/>
      <line x1="712" y1="58" x2="712" y2="512"/><line x1="936" y1="58" x2="936" y2="512"/>
    </g>
    <g font-size="11" fill="#ffffff">
      <rect x="60" y="80" width="180" height="46" rx="6" fill="#1a73e8"/>
      <text x="70" y="98">Team sync · 9:00</text>
      <rect x="284" y="150" width="180" height="70" rx="6" fill="#0b8043"/>
      <text x="294" y="168">Deep work · 10:00</text>
      <rect x="284" y="380" width="180" height="46" rx="6" fill="#039be5"/>
      <text x="294" y="398">1:1 with Alex · 12:00</text>
      <rect x="956" y="110" width="180" height="54" rx="6" fill="#8e24aa"/>
      <text x="966" y="128">Design review · 9:30</text>
      <rect x="956" y="300" width="180" height="60" rx="6" fill="#f4511e"/>
      <text x="966" y="318">Gym · 18:00</text>
      <rect x="732" y="230" width="180" height="46" rx="6" fill="#f6bf26"/>
      <text x="742" y="248" fill="#3c4043">Networking · 18:45</text>
    </g>
    <line x1="488" y1="330" x2="712" y2="330" stroke="#ea4335" stroke-width="2.5"/>
    <circle cx="488" cy="330" r="5" fill="#ea4335"/>

    <!-- edge shadows -->
    <rect x="40" y="58" width="0" height="454" fill="url(#shadeL)">
      <animate attributeName="width" values="0;0;280;280;0;0" keyTimes="0;0.48;0.58;0.88;0.94;1" dur="15s" repeatCount="indefinite"/>
    </rect>
    <rect x="1160" y="58" width="0" height="454" fill="url(#shadeR)">
      <animate attributeName="x" values="1160;1160;936;936;1160;1160" keyTimes="0;0.66;0.76;0.88;0.94;1" dur="15s" repeatCount="indefinite"/>
      <animate attributeName="width" values="0;0;224;224;0;0" keyTimes="0;0.66;0.76;0.88;0.94;1" dur="15s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- live-wallpaper mode: the icons come out on top of the calendar -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.375;0.41;0.88;0.92;1" dur="15s" repeatCount="indefinite"/>
    <use href="#icons" filter="url(#lift)"/>
  </g>

  <!-- the Settings window, as laid out in the app -->
  <g>
    <rect x="456" y="72" width="300" height="424" rx="10" fill="#000000" opacity="0.4"/>
    <rect x="450" y="66" width="300" height="424" rx="10" fill="#202124" stroke="#3c4043"/>
    <rect x="464" y="76" width="14" height="14" rx="3" fill="#1a73e8"/>
    <text x="486" y="88" fill="#e8eaed" font-size="11">Google Calendar Desktop Widget</text>
    <g stroke="#9aa0a6" stroke-width="1.4">
      <line x1="728" y1="78" x2="738" y2="88"/><line x1="738" y1="78" x2="728" y2="88"/>
    </g>

    <!-- transparency -->
    <text x="470" y="124" fill="#9aa0a6" font-size="9.5" font-weight="600" letter-spacing="1.5">TRANSPARENCY</text>
    <text x="730" y="124" fill="#8ab4f8" font-size="11" font-weight="600" text-anchor="end">15%
      <animate attributeName="opacity" values="1;1;0;0;1;1" keyTimes="0;0.08;0.10;0.24;0.26;1" dur="15s" repeatCount="indefinite"/>
    </text>
    <text x="730" y="124" fill="#8ab4f8" font-size="11" font-weight="600" text-anchor="end" opacity="0">60%
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.08;0.10;0.24;0.26;1" dur="15s" repeatCount="indefinite"/>
    </text>
    <rect x="470" y="138" width="260" height="4" rx="2" fill="#3c4043"/>
    <rect x="470" y="138" width="39" height="4" rx="2" fill="#1a73e8">
      <animate attributeName="width" values="39;39;156;156;39;39" keyTimes="0;0.04;0.14;0.22;0.30;1" dur="15s" repeatCount="indefinite"/>
    </rect>
    <circle cx="509" cy="140" r="7" fill="#8ab4f8" stroke="#ffffff" stroke-width="1.5">
      <animate attributeName="cx" values="509;509;626;626;509;509" keyTimes="0;0.04;0.14;0.22;0.30;1" dur="15s" repeatCount="indefinite"/>
    </circle>

    <!-- live wallpaper -->
    <rect x="470.5" y="158.5" width="13" height="13" rx="3" fill="none" stroke="#9aa0a6" stroke-width="1.3"/>
    <g opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.37;0.375;0.90;0.905;1" dur="15s" repeatCount="indefinite"/>
      <rect x="470" y="158" width="14" height="14" rx="3" fill="#8ab4f8"/>
      <path d="M473 165 l3 3 5 -6" stroke="#202124" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <text x="492" y="169" fill="#e8eaed" font-size="11">Sit behind desktop icons (live wallpaper)</text>

    <!-- edge shadows: two-handle slider -->
    <text x="470" y="204" fill="#9aa0a6" font-size="9.5" font-weight="600" letter-spacing="1.5">EDGE SHADOWS</text>
    <line x1="470" y1="222" x2="730" y2="222" stroke="#3c4043" stroke-width="6" stroke-linecap="round"/>
    <rect x="470" y="219" width="0" height="6" rx="3" fill="url(#fadeL)">
      <animate attributeName="width" values="0;0;65;65;0;0" keyTimes="0;0.48;0.58;0.88;0.94;1" dur="15s" repeatCount="indefinite"/>
    </rect>
    <rect x="730" y="219" width="0" height="6" rx="3" fill="url(#fadeR)">
      <animate attributeName="x" values="730;730;678;678;730;730" keyTimes="0;0.66;0.76;0.88;0.94;1" dur="15s" repeatCount="indefinite"/>
      <animate attributeName="width" values="0;0;52;52;0;0" keyTimes="0;0.66;0.76;0.88;0.94;1" dur="15s" repeatCount="indefinite"/>
    </rect>
    <circle cx="470" cy="222" r="8" fill="#8ab4f8">
      <animate attributeName="cx" values="470;470;535;535;470;470" keyTimes="0;0.48;0.58;0.88;0.94;1" dur="15s" repeatCount="indefinite"/>
    </circle>
    <circle cx="730" cy="222" r="8" fill="#8ab4f8">
      <animate attributeName="cx" values="730;730;678;678;730;730" keyTimes="0;0.66;0.76;0.88;0.94;1" dur="15s" repeatCount="indefinite"/>
    </circle>
    <g fill="#8ab4f8" font-size="10.5">
      <text x="470" y="246">Left off
        <animate attributeName="opacity" values="1;1;0;0;1;1" keyTimes="0;0.50;0.51;0.90;0.91;1" dur="15s" repeatCount="indefinite"/>
      </text>
      <text x="470" y="246" opacity="0">Left 25%
        <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.50;0.51;0.90;0.91;1" dur="15s" repeatCount="indefinite"/>
      </text>
      <text x="730" y="246" text-anchor="end">Right off
        <animate attributeName="opacity" values="1;1;0;0;1;1" keyTimes="0;0.68;0.69;0.90;0.91;1" dur="15s" repeatCount="indefinite"/>
      </text>
      <text x="730" y="246" text-anchor="end" opacity="0">Right 20%
        <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.68;0.69;0.90;0.91;1" dur="15s" repeatCount="indefinite"/>
      </text>
    </g>

    <!-- hover panel -->
    <text x="470" y="280" fill="#9aa0a6" font-size="9.5" font-weight="600" letter-spacing="1.5">HOVER PANEL</text>
    <rect x="470" y="290" width="14" height="14" rx="3" fill="#8ab4f8"/>
    <path d="M473 297 l3 3 5 -6" stroke="#202124" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="492" y="301" fill="#e8eaed" font-size="11">Show hover panel in a screen corner</text>
    <rect x="470" y="312" width="260" height="26" rx="4" fill="#303134" stroke="#5e6368"/>
    <text x="480" y="329" fill="#e8eaed" font-size="11">Bottom right</text>
    <path d="M712 322 l5 5 5 -5" stroke="#9aa0a6" stroke-width="1.4" fill="none"/>

    <!-- start with Windows -->
    <rect x="470" y="352" width="14" height="14" rx="3" fill="#8ab4f8"/>
    <path d="M473 359 l3 3 5 -6" stroke="#202124" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="492" y="363" fill="#e8eaed" font-size="11">Start with Windows</text>

    <!-- tip -->
    <text x="470" y="388" fill="#9aa0a6" font-size="9.5">Tip: for a dark widget, enable dark mode inside</text>
    <text x="470" y="401" fill="#9aa0a6" font-size="9.5">Google Calendar's own settings (gear icon).</text>

    <!-- buttons -->
    <rect x="470" y="414" width="260" height="30" rx="4" fill="#303134" stroke="#5e6368"/>
    <text x="600" y="433" fill="#f28b82" font-size="11" text-anchor="middle">♥  Support development (PayPal)</text>
    <rect x="470" y="452" width="120" height="30" rx="4" fill="#303134" stroke="#5e6368"/>
    <text x="530" y="471" fill="#e8eaed" font-size="11" text-anchor="middle">Exit widget</text>
    <rect x="610" y="452" width="120" height="30" rx="4" fill="#303134" stroke="#5e6368"/>
    <text x="670" y="471" fill="#e8eaed" font-size="11" text-anchor="middle">Sign out</text>
  </g>

  <!-- click on the checkbox -->
  <circle cx="477" cy="165" r="3" fill="none" stroke="#ffffff" stroke-width="2.5" opacity="0">
    <animate attributeName="r" values="3;3;18;18" keyTimes="0;0.37;0.42;1" dur="15s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0;0.9;0;0" keyTimes="0;0.37;0.375;0.42;1" dur="15s" repeatCount="indefinite"/>
  </circle>

  <!-- cursor: transparency, then live wallpaper, then both edge-shadow handles -->
  <g>
    <animateTransform attributeName="transform" type="translate"
      values="509 142; 509 142; 626 142; 626 142; 509 142; 477 166; 477 166; 470 224; 535 224; 535 224; 730 224; 678 224; 678 224; 600 300; 509 142"
      keyTimes="0;0.04;0.14;0.22;0.30;0.36;0.42;0.48;0.58;0.60;0.66;0.76;0.88;0.94;1" dur="15s" repeatCount="indefinite"/>
    <path d="M0 0 L0 20 L5.5 15 L9 24 L13 22 L9.5 13 L16.5 13 Z" fill="#ffffff" stroke="#3c4043" stroke-width="1.3"/>
  </g>

  <!-- captions -->
  <rect x="330" y="522" width="540" height="32" rx="16" fill="#202124" opacity="0.92"/>
  <g fill="#e8eaed" font-size="14" text-anchor="middle">
    <text x="600" y="543">One slider: from solid window to a ghost on your wallpaper
      <animate attributeName="opacity" values="1;1;0;0;1;1" keyTimes="0;0.29;0.32;0.94;0.97;1" dur="15s" repeatCount="indefinite"/>
    </text>
    <text x="600" y="543" opacity="0">Tuck it behind your desktop icons, like a live wallpaper
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.32;0.35;0.46;0.49;1" dur="15s" repeatCount="indefinite"/>
    </text>
    <text x="600" y="543" opacity="0">Edge shadows keep the icons readable on top of your calendar
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.49;0.52;0.90;0.93;1" dur="15s" repeatCount="indefinite"/>
    </text>
  </g>
</svg>
